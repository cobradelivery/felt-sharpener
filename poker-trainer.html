<!doctype html>

<style>

  }

    margin:0;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;

    min-height:100vh;
    width:100%;
    overflow-x:hidden;
  }

    margin:0 0 .5em 0;
  }

    font-variant-numeric:tabular-nums;
  }
  .micro{

    letter-spacing:.08em;
    font-size:.7rem;
    color:var(--muted);
  }

    flex-wrap:wrap;

    font-family:inherit;
  }
  nav.tabs button.active{

  }
  nav.tabs button:focus-visible,
  button:focus-visible,

<script>
(function(){
"use strict";

/* ============================================================
   1. CARD / DECK UTILITIES
   ============================================================ */
var RANK_CHARS = ["2","3","4","5","6","7","8","9","T","J","Q","K","A"];
var SUITS = ["s","h","d","c"];
var SUIT_GLYPH = {s:"♠",h:"♥",d:"♦",c:"♣"};

function rankChar(v){ return RANK_CHARS[v-2]; }
function charToRank(c){ return RANK_CHARS.indexOf(c)+2; }

function freshDeck(){
  var deck = [];
  for(var v=2; v<=14; v++){
    for(var i=0;i<SUITS.length;i++){
      deck.push({r:v, s:SUITS[i]});
    }
  }
  return deck;
}

function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp = a[i]; a[i]=a[j]; a[j]=tmp;
  }
  return a;
}

function cardKey(c){ return c.r+c.s; }

/* ============================================================
   2. RANGE NOTATION PARSER
   ============================================================ */
function canon(c1, c2){
  var r1=c1.r, r2=c2.r;
  if(r1===r2) return rankChar(r1)+rankChar(r1);
  var hi = Math.max(r1,r2), lo = Math.min(r1,r2);
  var suited = c1.s===c2.s;
  return rankChar(hi)+rankChar(lo)+(suited?"s":"o");
}

function parseSingleHandToken(t){
  var m;
  m = t.match(/^([2-9TJQKA])\1$/);
  if(m) return {pair:true, hi:charToRank(m[1]), lo:charToRank(m[1]), suf:null};
  m = t.match(/^([2-9TJQKA])([2-9TJQKA])(s|o)$/);
  if(m) return {pair:false, hi:charToRank(m[1]), lo:charToRank(m[2]), suf:m[3]};
  return null;
}

function expandToken(tok){
  var m;
  // pair plus, e.g. "77+"
  m = tok.match(/^([2-9TJQKA])\1\+$/);
  if(m){
    var startV = charToRank(m[1]);
    var out = [];
    for(var v=startV; v<=14; v++) out.push(rankChar(v)+rankChar(v));
    return out;
  }
  // exact pair, e.g. "TT"
  m = tok.match(/^([2-9TJQKA])\1$/);
  if(m) return [m[1]+m[1]];
  // suited/offsuit plus, e.g. "ATs+", "A9o+", "K5s+"
  m = tok.match(/^([2-9TJQKA])([2-9TJQKA])(s|o)\+$/);
  if(m){
    var hiV = charToRank(m[1]);
    var loStartV = charToRank(m[2]);
    var suf = m[3];
    var out2 = [];
    for(var lv=loStartV; lv<hiV; lv++) out2.push(m[1]+rankChar(lv)+suf);
    return out2;
  }
  // exact suited/offsuit, e.g. "54s", "QJs"
  m = tok.match(/^([2-9TJQKA])([2-9TJQKA])(s|o)$/);
  if(m) return [m[1]+m[2]+m[3]];
  return [];
}

function expandDash(tok){
  var parts = tok.split("-");
  if(parts.length !== 2) return [];
  var pa = parseSingleHandToken(parts[0]);
  var pb = parseSingleHandToken(parts[1]);
  if(!pa || !pb) return [];
  var out = [];
  if(pa.pair && pb.pair){
    var lo = Math.min(pa.hi, pb.hi), hi = Math.max(pa.hi, pb.hi);
    for(var v=lo; v<=hi; v++) out.push(rankChar(v)+rankChar(v));
    return out;
  }
  if(!pa.pair && !pb.pair && pa.suf===pb.suf && pa.hi===pb.hi){
    var lo2 = Math.min(pa.lo, pb.lo), hi2 = Math.max(pa.lo, pb.lo);
    for(var v2=lo2; v2<=hi2; v2++) out.push(rankChar(pa.hi)+rankChar(v2)+pa.suf);
    return out;
  }
  return [];
}

function parseRange(str){
  str = str.replace(/any suited ace/ig, "A2s+");
  var tokens = str.split(",").map(function(s){return s.trim();}).filter(Boolean);
  var set = new Set();
  for(var i=0;i<tokens.length;i++){
    var t = tokens[i];
    var codes = t.indexOf("-") !== -1 ? expandDash(t) : expandToken(t);
    for(var j=0;j<codes.length;j++) set.add(codes[j]);
  }
  return set;
}

function allCodes(){
  var out = [];
  for(var v=2; v<=14; v++) out.push(rankChar(v)+rankChar(v));
  for(var hi=3; hi<=14; hi++){
    for(var lo=2; lo<hi; lo++){
      out.push(rankChar(hi)+rankChar(lo)+"s");
      out.push(rankChar(hi)+rankChar(lo)+"o");
    }
  }
  return out;
}
var ALL_CODES = allCodes();

function neighborsOf(code){
  var out = [];
  if(code.length===2){
    var v = charToRank(code[0]);
    if(v-1>=2) out.push(rankChar(v-1)+rankChar(v-1));
    if(v+1<=14) out.push(rankChar(v+1)+rankChar(v+1));
    return out;
  }
  var hi = charToRank(code[0]), lo = charToRank(code[1]), suf = code[2];
  [-1,1].forEach(function(d){
    var nlo = lo+d;
    if(nlo>=2 && nlo<hi) out.push(rankChar(hi)+rankChar(nlo)+suf);
  });
  [-1,1].forEach(function(d){
    var nhi = hi+d;
    if(nhi>lo && nhi<=14) out.push(rankChar(nhi)+rankChar(lo)+suf);
  });
  return out;
}

function buildBorderlinePool(rangeSet){
  var pool = new Set();
  for(var i=0;i<ALL_CODES.length;i++){
    var code = ALL_CODES[i];
    if(rangeSet.has(code)){ pool.add(code); continue; }
    var neigh = neighborsOf(code);
    for(var j=0;j<neigh.length;j++){
      if(rangeSet.has(neigh[j])){ pool.add(code); break; }
    }
  }
  return pool;
}

function codeToCards(code){
  var isPair = code.length===2;
  if(isPair){
    var v = charToRank(code[0]);
    var suits = shuffle(SUITS).slice(0,2);
    return [{r:v,s:suits[0]}, {r:v,s:suits[1]}];
  }
  var hi = charToRank(code[0]), lo = charToRank(code[1]), suited = code[2]==="s";
  if(suited){
    var s = SUITS[Math.floor(Math.random()*4)];
    return [{r:hi,s:s},{r:lo,s:s}];
  }
  var s1 = SUITS[Math.floor(Math.random()*4)];
  var s2;
  do { s2 = SUITS[Math.floor(Math.random()*4)]; } while(s2===s1);
  return [{r:hi,s:s1},{r:lo,s:s2}];
}

function dealWeightedHand(rangeSet){
  var borderline = buildBorderlinePool(rangeSet);
  var useBorderline = Math.random() < 0.5 && borderline.size > 0;
  var pool = useBorderline ? Array.from(borderline) : ALL_CODES;
  var code = pool[Math.floor(Math.random()*pool.length)];
  return codeToCards(code);
}

/* ============================================================
   3. 5/7-CARD HAND EVALUATOR
   ============================================================ */
function evaluate5(cards){
  var ranks = cards.map(function(c){return c.r;}).sort(function(a,b){return b-a;});
  var suits = cards.map(function(c){return c.s;});
  var isFlush = suits.every(function(s){return s===suits[0];});
  var rankCounts = {};
  for(var i=0;i<ranks.length;i++) rankCounts[ranks[i]] = (rankCounts[ranks[i]]||0)+1;
  var distinct = Object.keys(rankCounts).map(Number).sort(function(a,b){return b-a;});
  var straightHigh = null;
  if(distinct.length===5){
    if(distinct[0]-distinct[4]===4) straightHigh = distinct[0];
    else if(distinct[0]===14 && distinct[1]===5 && distinct[2]===4 && distinct[3]===3 && distinct[4]===2) straightHigh = 5;
  }
  if(straightHigh && isFlush) return [8, straightHigh];
  var groups = distinct.map(function(r){return {r:r, c:rankCounts[r]};})
    .sort(function(a,b){ return (b.c-a.c) || (b.r-a.r); });
  if(groups[0].c===4){
    return [7, groups[0].r, groups[1].r];
  }
  if(groups[0].c===3 && groups[1] && groups[1].c===2){
    return [6, groups[0].r, groups[1].r];
  }
  if(isFlush){
    return [5].concat(ranks);
  }
  if(straightHigh){
    return [4, straightHigh];
  }
  if(groups[0].c===3){
    var kick3 = groups.slice(1).map(function(g){return g.r;}).sort(function(a,b){return b-a;});
    return [3, groups[0].r].concat(kick3);
  }
  if(groups[0].c===2 && groups[1] && groups[1].c===2){
    var pairRanks = [groups[0].r, groups[1].r].sort(function(a,b){return b-a;});
    return [2, pairRanks[0], pairRanks[1], groups[2].r];
  }
  if(groups[0].c===2){
    var kick1 = groups.slice(1).map(function(g){return g.r;}).sort(function(a,b){return b-a;});
    return [1, groups[0].r].concat(kick1);
  }
  return [0].concat(ranks);
}

function cmpVal(a, b){
  var len = Math.max(a.length, b.length);
  for(var i=0;i<len;i++){
    var av = a[i]===undefined?0:a[i];
    var bv = b[i]===undefined?0:b[i];
    if(av!==bv) return av-bv;
  }
  return 0;
}

function combos5of7(cards){
  var res = [];
  for(var a=0;a<7;a++) for(var b=a+1;b<7;b++) for(var c=b+1;c<7;c++)
    for(var d=c+1;d<7;d++) for(var e=d+1;e<7;e++)
      res.push([cards[a],cards[b],cards[c],cards[d],cards[e]]);
  return res;
}

function evaluate7(cards){
  var best = null;
  var combos = combos5of7(cards);
  for(var i=0;i<combos.length;i++){
    var v = evaluate5(combos[i]);
    if(best===null || cmpVal(v,best) > 0) best = v;
  }
  return best;
}

function kCombinations(arr, k){
  var results = [];
  var combo = [];
  var n = arr.length;
  function helper(start){
    if(combo.length===k){ results.push(combo.slice()); return; }
    for(var i=start;i<n;i++){
      combo.push(arr[i]);
      helper(i+1);
      combo.pop();
    }
  }
  helper(0);
  return results;
}

/* Generic best-of-N (N=5..8) evaluator: picks the best 5-card hand out of
   however many cards are supplied. Used by computeOuts, which evaluates
   hero+board+one-candidate-card (5, 6 or 7 total cards depending on street). */
function evaluateBest(cards){
  if(cards.length===5) return evaluate5(cards);
  if(cards.length===7) return evaluate7(cards);
  var best = null;
  var combos = kCombinations(cards, 5);
  for(var i=0;i<combos.length;i++){
    var v = evaluate5(combos[i]);
    if(best===null || cmpVal(v,best) > 0) best = v;
  }
  return best;
}

/* ============================================================
   3b. OUTS BY ENUMERATION (Pot Odds & Outs drill)
   Rather than trusting a fixed per-draw-type outs constant, derive the
   true out-count from the actual dealt hero cards + board: for every
   unseen card, append it and check whether hero's best hand reaches the
   drawId's target category. Each unseen card is visited once, so a card
   that would satisfy multiple criteria (e.g. a combo draw's overlap
   cards) is still only counted once — that fall-out is automatic, not a
   separate dedupe step.
   ============================================================ */
function computeOuts(heroCards, board, drawId){
  var used = {};
  heroCards.concat(board).forEach(function(c){ used[cardKey(c)] = true; });
  var unseen = freshDeck().filter(function(c){ return !used[cardKey(c)]; });
  var maxBoardRank = Math.max.apply(null, board.map(function(c){ return c.r; }));
  var count = 0;
  for(var i=0;i<unseen.length;i++){
    var cand = unseen[i];
    var combined = heroCards.concat(board).concat([cand]);
    var val = evaluateBest(combined);
    var qualifies = false;
    if(drawId==="flush"){
      qualifies = val[0] >= 5; // flush or better
    } else if(drawId==="oesd" || drawId==="gutshot"){
      qualifies = val[0] >= 4; // straight or better
    } else if(drawId==="combo"){
      qualifies = val[0] >= 4; // straight, flush, or better
    } else if(drawId==="overcards"){
      if(val[0] >= 1){
        var pairedRank = val[1];
        var usesHeroRank = (pairedRank===heroCards[0].r) || (pairedRank===heroCards[1].r);
        qualifies = usesHeroRank && pairedRank >= maxBoardRank;
      }
    }
    if(qualifies) count++;
  }
  return count;
}

var OUTS_SANITY_RANGE = {flush:[7,9], oesd:[6,8], gutshot:[3,5], overcards:[3,6], combo:[11,17]};
function isReasonableOuts(drawId, outs){
  var r = OUTS_SANITY_RANGE[drawId] || [0,99];
  return outs >= r[0] && outs <= r[1];
}

function genFacing(){
  var heroPos = FACING_HERO_POS[Math.floor(Math.random()*FACING_HERO_POS.length)];
  var raiserOpts = RAISER_BY_HERO[heroPos];
  var raiserPos = raiserOpts[Math.floor(Math.random()*raiserOpts.length)];
  // weight deal toward union of relevant ranges for a meatier drill
  var relevantUnion = new Set();
  FACING.threeBet.forEach(function(c){relevantUnion.add(c);});
  FACING.callCOBTN.forEach(function(c){relevantUnion.add(c);});
  FACING.bbAdd.forEach(function(c){relevantUnion.add(c);});

  var cards = dealWeightedHand(relevantUnion);
  var code = canon(cards[0], cards[1]);
  var correct = gradeFacing(code, heroPos);
  var explanation = explainFacing(code, heroPos, correct);
  return {heroPos:heroPos, raiserPos:raiserPos, cards:cards, code:code, correct:correct, explanation:explanation};
}

function gradeFacing(code, heroPos){
  if(FACING.threeBet.has(code)) return "3-bet";
  if(heroPos==="SB"){
    return FACING.sbThreeBet.has(code) ? "3-bet" : "fold";
  }
  if(heroPos==="BB"){
    if(FACING.callCOBTN.has(code) || FACING.bbAdd.has(code)) return "call";
    return "fold";
  }
  // CO / BTN
  if(FACING.callCOBTN.has(code)) return "call";
  return "fold";
}

function explainFacing(code, heroPos, correct){
  if(correct==="3-bet") return code + " is strong enough to 3-bet here.";
  if(heroPos==="SB") return code + " " + (correct==="3-bet" ? "3-bets" : "folds") + " — the SB plays 3-bet-or-fold.";
  if(heroPos==="BB") return code + " " + (correct==="call" ? "is a profitable call from the big blind." : "is too weak even for the big blind's wide defense.");
  return code + " " + (correct==="call" ? "is a good in-position call." : "is too weak to continue in position.");
}

/* ============================================================
   7. DRILL 3 — POT ODDS & OUTS
   ============================================================ */
var DRAW_TYPES = [
  {id:"flush", label:"flush draw"},
  {id:"oesd", label:"open-ended straight draw"},
  {id:"gutshot", label:"gutshot straight draw"},
  {id:"overcards", label:"two overcards"},
  {id:"combo", label:"combo draw (flush + straight)"}
];

function pickDistinctRanks(n, minV, maxV, avoid){
  avoid = avoid || [];
  var out = [];
  var guard = 0;
  while(out.length < n && guard < 500){
    guard++;
    var v = minV + Math.floor(Math.random()*(maxV-minV+1));
    if(out.indexOf(v)===-1 && avoid.indexOf(v)===-1) out.push(v);
  }
  return out;
}

function otherSuit(s){
  var opts = SUITS.filter(function(x){return x!==s;});
  return opts[Math.floor(Math.random()*opts.length)];
}

function genPotOddsCards(drawId, street){
  var heroCards, board;
  if(drawId==="flush"){
    var F = SUITS[Math.floor(Math.random()*4)];
    var ranks = pickDistinctRanks(4, 2, 14, []);
    heroCards = [{r:ranks[0],s:F},{r:ranks[1],s:F}];
    board = [{r:ranks[2],s:F},{r:ranks[3],s:F},{r:pickDistinctRanks(1,2,14,ranks)[0], s:otherSuit(F)}];
    if(street==="turn") board.push({r:pickDistinctRanks(1,2,14,ranks.concat([board[2].r]))[0], s:otherSuit(F)});
  } else if(drawId==="oesd"){
    var start = 3 + Math.floor(Math.random()*8); // 3..10 so start-1 and start+4 both in range
    var r = [start, start+1, start+2, start+3];
    heroCards = [{r:r[0], s:"s"}, {r:r[1], s:"h"}];
    // filler cards must avoid the whole start-1..start+4 window, or they'd
    // accidentally complete/extend the straight before any "out" is dealt
    var oesdWindow = [start-1, start, start+1, start+2, start+3, start+4];
    var offRank = pickDistinctRanks(1, 2, 14, oesdWindow)[0];
    board = [{r:r[2], s:"d"}, {r:r[3], s:"c"}, {r:offRank, s:"s"}];
    if(street==="turn") board.push({r:pickDistinctRanks(1,2,14,oesdWindow.concat([offRank]))[0], s:"h"});
  } else if(drawId==="gutshot"){
    var s0 = 3 + Math.floor(Math.random()*8);
    var g = [s0, s0+1, s0+3, s0+4]; // missing s0+2
    heroCards = [{r:g[0], s:"s"}, {r:g[1], s:"h"}];
    // avoid the whole s0-1..s0+5 window: s0+2 would make an immediate made
    // straight, and s0-1/s0+5 would open a second way to complete it
    var gutshotWindow = [s0-1, s0, s0+1, s0+2, s0+3, s0+4, s0+5];
    var offRank2 = pickDistinctRanks(1, 2, 14, gutshotWindow)[0];
    board = [{r:g[2], s:"d"}, {r:g[3], s:"c"}, {r:offRank2, s:"s"}];
    if(street==="turn") board.push({r:pickDistinctRanks(1,2,14,gutshotWindow.concat([offRank2]))[0], s:"h"});
  } else if(drawId==="overcards"){
    var hi = pickDistinctRanks(2, 10, 14, []);
    heroCards = [{r:hi[0], s:"s"}, {r:hi[1], s:"h"}];
    var lowRanks = pickDistinctRanks(street==="turn"?4:3, 2, 8, hi);
    board = lowRanks.map(function(r,i){return {r:r, s:(i%2===0?"d":"c")};});
  } else { // combo: flush draw (4 suited) stacked with an open-ended straight draw
    var F2 = SUITS[Math.floor(Math.random()*4)];
    var start2 = 3 + Math.floor(Math.random()*8);
    heroCards = [{r:start2+1, s:F2}, {r:start2+2, s:F2}];
    var comboWindow = [start2-1, start2, start2+1, start2+2, start2+3, start2+4];
    // board carries the OTHER two suited cards of the run (start2 and start2+3),
    // so hero+board together hold 4 cards of suit F2 (a real flush draw) as well
    // as all four consecutive ranks (a real open-ended straight draw)
    board = [{r:start2+3, s:F2}, {r:start2, s:F2}, {r:pickDistinctRanks(1,2,14,comboWindow)[0], s:otherSuit(F2)}];
    if(street==="turn") board.push({r:pickDistinctRanks(1,2,14,comboWindow.concat([board[2].r]))[0], s:otherSuit(F2)});
  }
  return {heroCards:heroCards, board:board};
}

function roundClean(n){ return Math.round(n/5)*5; }

function genPotOdds(){
  var draw = DRAW_TYPES[Math.floor(Math.random()*DRAW_TYPES.length)];
  var street = Math.random() < 0.5 ? "flop" : "turn";

  // Derive outs from the actual dealt cards by enumeration (not a fixed
  // per-draw-type lookup). If the generator produced a degenerate layout
  // (outs wildly off the archetype), regenerate the scenario — up to 3
  // attempts — then accept whatever the derived count is.
  var dealt, outs, attempts = 0;
  do {
    dealt = genPotOddsCards(draw.id, street);
    outs = computeOuts(dealt.heroCards, dealt.board, draw.id);
    attempts++;
  } while(!isReasonableOuts(draw.id, outs) && attempts < 3);

  var pot = roundClean(60 + Math.floor(Math.random()*341));
  var mults = [1/3, 1/2, 2/3, 1];
  var mult = mults[Math.floor(Math.random()*mults.length)];
  var bet = roundClean(pot*mult) || 10;
  var requiredEquity = (bet/(pot+2*bet))*100;
  var requiredRounded = Math.round(requiredEquity);
  var ruleMultiplier = street==="flop" ? 4 : 2;
  var estEquity = outs * ruleMultiplier;
  var correctB = estEquity >= requiredRounded ? "call" : "fold";

  // (a) options: correct + 3 distractors
  var wrongFormula = Math.round((bet/(pot+bet))*100);
  var distractorsA = [requiredRounded+10, requiredRounded-10, wrongFormula];
  var optsA = uniqueClamp([requiredRounded].concat(distractorsA), 1, 95);
  optsA = shuffle(optsA);

  var explanation = "Pot " + pot + ", bet " + bet + " → call " + bet + " to win " + (pot+2*bet) +
    " → need " + requiredRounded + "%. " + outs + " " + draw.label + " outs × " + ruleMultiplier +
    " ≈ " + estEquity + "% → " + (correctB==="call" ? "call." : "fold.");

  return {
    draw: draw, street: street, heroCards: dealt.heroCards, board: dealt.board,
    pot: pot, bet: bet, requiredRounded: requiredRounded, outs: outs, estEquity: estEquity,
    optsA: optsA, correctA: requiredRounded, correctB: correctB, explanation: explanation
  };
}

function uniqueClamp(arr, lo, hi){
  var seen = {}; var out = [];
  for(var i=0;i<arr.length;i++){
    var v = Math.max(lo, Math.min(hi, arr[i]));
    while(seen[v]) v = v+3;
    seen[v]=true;
    out.push(v);
  }
  return out;
}

function genPushFold(){
  var stack = 5 + Math.floor(Math.random()*8); // 5..12
  var pos = POSITIONS[Math.floor(Math.random()*POSITIONS.length)];
  var rangeSet = PUSH_RANGES[pos];
  var cards = dealWeightedHand(rangeSet);
  var code = canon(cards[0], cards[1]);
  var inRange = rangeSet.has(code);
  var lenient = false;
  var strictCorrect = inRange ? "shove" : "fold";
  if(stack <= 7){
    var borderline = buildBorderlinePool(rangeSet);
    if(!inRange && borderline.has(code)) lenient = true;
  }

    (inRange ? "a clear shove." : (lenient ? "close — either shove or fold is defensible at this stack." : "a fold here."));
  return {stack:stack, pos:pos, cards:cards, code:code, correct:strictCorrect, lenient:lenient, explanation:explanation};
}

var CURATED_MATCHUPS = [
  {a:"TT", b:"AKo", tag:"pair vs overcards"},
  {a:"AKo", b:"AQo", tag:"dominated ace (kicker)"},
  {a:"98s", b:"55", tag:"suited connectors vs pair"},

  {a:"KQs", b:"AJo", tag:"suited broadway vs offsuit ace"},
  {a:"JJ", b:"AKs", tag:"pair vs two overs (suited)"}
];

function codeToConcreteCards(code, used){
  var attempt = 0;
  while(attempt < 200){
    attempt++;
    var cards = codeToCards(code);
    var k0 = cardKey(cards[0]), k1 = cardKey(cards[1]);
    if(used.indexOf(k0)===-1 && used.indexOf(k1)===-1 && k0!==k1) return cards;
  }
  return null;
}

function genEquityHands(){
  var useCurated = Math.random() < 0.75;
  var used = [];
  if(useCurated){
    var m = CURATED_MATCHUPS[Math.floor(Math.random()*CURATED_MATCHUPS.length)];
    var h1 = codeToConcreteCards(m.a, used);
    used.push(cardKey(h1[0]), cardKey(h1[1]));
    var h2 = codeToConcreteCards(m.b, used);
    return {hand1:h1, hand2:h2, tag:m.tag};
  }
  var deck = shuffle(freshDeck());
  var h1r = [deck[0], deck[1]];
  var h2r = [deck[2], deck[3]];
  return {hand1:h1r, hand2:h2r, tag:"random matchup"};
}

function runMonteCarlo(hand1, hand2, iters){
  var used = {};
  [hand1[0],hand1[1],hand2[0],hand2[1]].forEach(function(c){ used[cardKey(c)] = true; });
  var remaining = freshDeck().filter(function(c){ return !used[cardKey(c)]; });
  var wins1 = 0, wins2 = 0, ties = 0;
  for(var i=0;i<iters;i++){
    // sample 5 distinct cards from `remaining` without replacement (partial Fisher-Yates)
    var pool = remaining.slice();
    var board = [];
    for(var k=0;k<5;k++){
      var j = k + Math.floor(Math.random()*(pool.length-k));
      var tmp = pool[k]; pool[k]=pool[j]; pool[j]=tmp;
      board.push(pool[k]);
    }
    var v1 = evaluate7(hand1.concat(board));
    var v2 = evaluate7(hand2.concat(board));
    var c = cmpVal(v1, v2);
    if(c>0) wins1++; else if(c<0) wins2++; else ties++;
  }
  var equity1 = (wins1 + ties/2) / iters * 100;
  var equity2 = (wins2 + ties/2) / iters * 100;
  return {equity1:equity1, equity2:equity2, wins1:wins1, wins2:wins2, ties:ties, iters:iters};
}

function bandFor(equity){
  var lo = Math.floor(equity/5)*5;
  if(lo >= equity) lo -= 5;
  return [lo, lo+5];
}

function genEquityOptions(equity){
  var correctBand = bandFor(equity);
  var offsets = [-20, -10, 15, 25, 30, -30, 20];
  var bands = [correctBand];
  var used = {}; used[correctBand[0]] = true;
  var oi = 0;
  while(bands.length < 4 && oi < offsets.length){
    var start = correctBand[0] + offsets[oi]; oi++;
    start = Math.max(0, Math.min(90, start));
    if(!used[start]){ used[start]=true; bands.push([start, start+5]); }
  }
  return shuffle(bands);
}

var QUIZ_STATE = {queue: [], idx: 0};

function nextQuizIndex(){
  if(QUIZ_STATE.idx >= QUIZ_STATE.queue.length){
    var order = [];
    for(var i=0;i<QUIZ_BANK.length;i++) order.push(i);
    QUIZ_STATE.queue = shuffle(order);
    QUIZ_STATE.idx = 0;
  }
  return QUIZ_STATE.queue[QUIZ_STATE.idx++];
}

function genQuiz(){

  return {bankIdx: bankIdx, item: QUIZ_BANK[bankIdx], answered:false, given:null};

/* ============================================================
   9b. COACH — plain-English explanations (rule-based, pure functions)
   ============================================================ */
var RANK_WORDS = {14:"ace",13:"king",12:"queen",11:"jack",10:"ten",9:"nine",8:"eight",7:"seven",6:"six",5:"five",4:"four",3:"three",2:"two"};

function glyphLabel(cards){
  return cards.map(function(c){ return rankChar(c.r) + SUIT_GLYPH[c.s]; }).join("");
}

/* Family classification, in the priority order specified: pocket pair /
   suited ace / broadway (both T+) / suited connector / suited one-gapper /
   junk. A hand only ever gets ONE primary family; describeHand() adds a
   secondary note when a broadway hand is also suited-and-connected. */
function classifyHandFamily(c1, c2){
  if(c1.r===c2.r) return "pocket pair";
  var suited = c1.s===c2.s;
  var hi = Math.max(c1.r,c2.r), lo = Math.min(c1.r,c2.r);
  if(suited && hi===14) return "suited ace";
  if(hi>=10 && lo>=10) return "broadway";
  if(suited && (hi-lo)===1) return "suited connector";
  if(suited && (hi-lo)===2) return "suited one-gapper";
  return "junk";
}

var FAMILY_LINES = {
  "pocket pair": "Pairs start ahead of most random hands and can turn into three-of-a-kind (a \"set\") roughly 1 in 7.5 times you see a flop.",
  "suited ace": "A suited ace can make the nut (best possible) flush, which lets it profitably play in spots a plain offsuit ace can't.",
  "broadway": "Two broadway cards (T, J, Q, K, or A) make strong top pairs and good straights, so they play well even when they miss a flush.",
  "suited connector": "Suited connectors flop straights and flushes more often than a random hand and can win big pots when they connect.",
  "suited one-gapper": "A one-gap suited hand still makes straights and flushes, it just needs one more card to fill the gap.",
  "junk": "No pair, no suit, no broadway strength, and no connectivity between the ranks — this is a hand that mostly wants to fold before the flop."
};

function describeHand(cards){
  var pair = cards[0].r === cards[1].r;
  var hi = Math.max(cards[0].r, cards[1].r), lo = Math.min(cards[0].r, cards[1].r);
  var suited = cards[0].s === cards[1].s;
  var glyphs = glyphLabel(cards);
  var lead;
  if(pair){
    lead = glyphs + " — pocket " + RANK_WORDS[hi] + "s: a pocket pair.";
  } else {
    lead = glyphs + " — " + RANK_WORDS[hi] + "-" + RANK_WORDS[lo] + " " + (suited?"suited":"offsuit") + ": " +
      (suited
        ? "same suit — five more cards of that suit complete a flush."
        : "different suits, no pair. Offsuit hands are weaker because they can't make a flush as easily.");
  }
  var family = classifyHandFamily(cards[0], cards[1]);
  var text = lead + " " + FAMILY_LINES[family];
  if(family==="broadway" && suited && (hi-lo)===1){
    text += " It's also suited and connected (a suited connector shape), adding backup straight and flush possibilities.";
  }
  return {text: text, family: family};
}

/* Boundary-hand finder: derives the loosest/weakest hand of the SAME
   family+shape (pair, or fixed-high-card + suited/offsuit) that is present
   in the given range set — computed from the range data itself, never
   hardcoded. Used to explain exactly how far a hand is from the line. */
function findBoundaryHand(rangeSet, code){
  var inRange = rangeSet.has(code);
  if(code.length===2){
    var minVal = null;
    rangeSet.forEach(function(rc){
      if(rc.length===2){
        var v = charToRank(rc[0]);
        if(minVal===null || v<minVal) minVal = v;
      }
    });
    if(minVal===null) return {inRange:inRange, none:true};
    return {inRange:inRange, none:false, boundaryLabel: rankChar(minVal)+rankChar(minVal)};
  }
  var hi = code[0], suf = code[2];
  var minLow = null;
  rangeSet.forEach(function(rc){
    if(rc.length===3 && rc[0]===hi && rc[2]===suf){
      var lv = charToRank(rc[1]);
      if(minLow===null || lv<minLow) minLow = lv;
    }
  });
  if(minLow===null) return {inRange:inRange, none:true};
  return {inRange:inRange, none:false, boundaryLabel: hi+rankChar(minLow)+suf};
}

var DOMINATION_LINE = "when a hand like this gets called, it's often by exactly that kind of hand, which makes the same pair with a better kicker — you're \"dominated\".";

function explainRangeDecision(cards, rangeSet, actionWord, foldWord){
  var code = canon(cards[0], cards[1]);
  var boundary = findBoundaryHand(rangeSet, code);
  var parts = [];
  if(boundary.inRange){
    parts.push(code + " is inside the range here, so " + actionWord + " is correct.");
    if(!boundary.none && boundary.boundaryLabel !== code){
      parts.push("The loosest hand of this exact type still played here is " + boundary.boundaryLabel + ", so " + code + " clears that line.");
    }
  } else {
    parts.push(code + " is outside the range here, so " + foldWord + " is correct.");
    if(!boundary.none){
      var missWord = code.length===2 ? "Your pair" : "Your kicker";
      parts.push("The weakest hand of this type that's played here is " + boundary.boundaryLabel + ". " + missWord + " misses that line, and " + DOMINATION_LINE);
    } else {
      parts.push("This position never plays any hand of this exact type — everything here folds.");
    }
  }
  return parts.join(" ");
}

function explainFacingWhy(code, heroPos, raiserPos, correctAnswer){
  var parts = [];
  parts.push("A \"3-bet\" is a re-raise before the flop — " + raiserPos + "'s open was the first raise, a 3-bet would be the second.");
  if(correctAnswer==="3-bet"){
    parts.push(code + " is one of the always-3-bet hands here: premium pairs and big aces want more chips in the pot for value, and a hand like A5s is live and disguised enough to profitably represent a bigger hand.");
  } else if(heroPos==="SB"){
    parts.push("Out of the small blind you'll be first to act on every remaining street, which means acting on less information than everyone else all the way down — a real, ongoing cost. This drill treats the SB as 3-bet-or-fold: either seize the initiative now or don't play the hand.");
    parts.push(code + (correctAnswer==="fold" ? " isn't strong enough to 3-bet here, so it folds rather than calling into a tough, out-of-position pot." : " 3-bets rather than calling, for the same reason."));
  } else if(heroPos==="BB"){
    if(correctAnswer==="call"){
      parts.push("The big blind has already committed a chip and gets the best price of anyone to continue, so it can profitably defend a much wider range than a fresh open — " + code + " is worth continuing here.");
    } else {
      parts.push("Even with the big blind's wide defense and good price, " + code + " is too weak to continue profitably, so it folds.");
    }
  } else {
    if(correctAnswer==="call"){
      parts.push("Acting after the raiser on every future street (being \"in position\") means a call needs less raw strength to be profitable, because you get to see how the hand develops before committing more — " + code + " calls rather than 3-betting since it isn't strong enough to want to build a bigger pot.");
    } else {
      parts.push(code + " folds here because calling still leaves you facing a stronger range with no immediate way to know where you stand — calling just to \"see what happens\" loses money in the long run with a hand this weak.");
    }
  }
  return parts.join(" ");
}

function explainPotOddsWhy(q){
  var toWin = q.pot + 2*q.bet;
  var ruleMultiplier = q.street==="flop" ? 4 : 2;
  var toComeWord = q.street==="flop" ? "two cards" : "one card";
  return "The pot is " + q.pot + " and villain bets " + q.bet + ". You must call " + q.bet + " for a shot at " + toWin +
    ", so you need to win " + q.requiredRounded + "% of the time to break even — that's your \"pot odds\". " +
    "You have " + q.outs + " \"outs\" — cards that complete your " + q.draw.label + ". " +
    "Rule of " + ruleMultiplier + ": with " + toComeWord + " to come, each out is worth about " + ruleMultiplier + "%, so about " + q.estEquity + "% — " +
    (q.correctB==="call" ? "that clears the price, so you call." : "you're not getting the right price, so you fold.");
}

var EQUITY_ARCHETYPE_EXPLAIN = {
  "pair vs overcards": "This is the classic \"coin flip\" shape: a pocket pair against two higher, unpaired cards. The pair is already a made hand while the overcards still need to pair up, so the pair is a slight favorite.",
  "dominated ace (kicker)": "This is a \"dominated\" ace: both hands have an ace, but one has a much better kicker. The dominated hand can only win by pairing its kicker (or catching a rare runner-runner hand), so it's a big underdog.",
  "suited connectors vs pair": "Suited connectors against a pocket pair race for different reasons: the pair is already made, but the connectors can catch a straight or flush that a single pair can't beat — still an underdog, but with real chances to flip the result.",
  "classic race": "Two big cards against a lower pocket pair is the classic \"race\": neither hand is made yet, and it usually runs close to 50/50 depending on suits and blockers.",
  "dominated kicker": "Same top card, weaker second card — the dominated hand needs to catch its kicker to have any real shot, so it's a significant underdog.",
  "overpair vs underpair": "A bigger pocket pair against a smaller one is \"overpair vs underpair\": the bigger pair is already ahead and only loses if the smaller pair hits a two- or three-outer, so it's a big favorite.",
  "suited broadway vs offsuit ace": "Two live, similarly-strong hands (one suited, one with an ace kicker) usually run close, with suit and blocker effects deciding the edge.",
  "pair vs two overs (suited)": "A pocket pair facing two live, suited overcards is another coin-flip shape — the pair is slightly ahead as a made hand, but the suited overcards carry real backdoor straight and flush equity.",
  "random matchup": "This is just two random hands — with no dominant relationship between them (no shared cards, no big pair vs small pair), the exact percentage depends on how well their ranks and suits interact."
};

function explainEquityWhy(q){
  var line = EQUITY_ARCHETYPE_EXPLAIN[q.tag] || EQUITY_ARCHETYPE_EXPLAIN["random matchup"];
  return line + " The simulation ran " + q.sim.iters + " random boards: Hand 1 won " + q.sim.equity1.toFixed(1) + "% of the time, Hand 2 won " + q.sim.equity2.toFixed(1) + "%.";
}

var MISCONCEPTIONS = {
  "suited ace": "Suited cards look pretty, but suitedness only adds about 3% equity on its own — it doesn't rescue a weak kicker or a hand that's otherwise too loose to play.",
  "broadway": "Big cards feel strong, but out of position or against a raise they still need to clear the actual opening or defending line — \"looks good\" isn't the same as \"in range\".",
  "pocket pair": "Small pocket pairs are tempting, but they only turn into three-of-a-kind about 1 in 7.5 times — without a deep stack and implied odds behind them, they're not an automatic play.",
  "suited connector": "Suited connectors are fun postflop hands, but that potential doesn't matter if the position or stack size doesn't give them room to see a cheap flop.",
  "suited one-gapper": "A one-gap suited hand still needs to hit a draw — it isn't strong enough on its own to justify playing from a tight spot.",
  "junk": "This hand has no pair, no suit synergy, and no broadway strength — nothing here overrides what the spot actually calls for."
};

function misconceptionFor(cards){
  var family = classifyHandFamily(cards[0], cards[1]);
  return MISCONCEPTIONS[family];
}

/* Dispatches to the right "Why" builder per drill, then appends a
   misconception line (keyed off the dealt hand's family) when the given
   answer was wrong. */
function explainDecision(drillId, q, givenAnswer){
  var why = "";
  if(drillId==="openfold"){
    why = explainRangeDecision(q.cards, OPEN_RANGES[q.pos], "raising", "folding");
  } else if(drillId==="pushfold"){
    why = explainRangeDecision(q.cards, PUSH_RANGES[q.pos], "shoving", "folding");
    if(q.lenient) why += " At " + q.stack + "bb the line blurs — either shove or fold is defensible here, so both answers are accepted.";
  } else if(drillId==="facing"){
    why = explainFacingWhy(q.code, q.heroPos, q.raiserPos, q.correct);
  } else if(drillId==="potodds"){
    why = explainPotOddsWhy(q);
  } else if(drillId==="equity"){
    why = explainEquityWhy(q);
  } else if(drillId==="quiz"){
    why = q.item.why;
  }
  var isWrong;
  if(drillId==="potodds"){
    isWrong = !((q.givenA===q.correctA) && (q.givenB===q.correctB));
  } else if(drillId==="equity"){
    var correctBand = bandFor(q.sim.equity1);
    isWrong = givenAnswer !== (correctBand[0]+"-"+correctBand[1]);
  } else if(drillId==="quiz"){
    isWrong = Number(givenAnswer) !== q.item.correct;
  } else {
    isWrong = q.lenient ? false : (givenAnswer !== q.correct);
  }
  if(isWrong){
    var handForMisconception = q.cards || q.hand1;
    if(handForMisconception) why += " " + misconceptionFor(handForMisconception);
  }
  return why;
}

var POSITION_TEXT = {
  EP: "EP = early position (under the gun and the seats right after it). You're first to act with the most players still behind you, so you need a tight, strong range to open.",
  MP: "MP = middle position. A few players have folded, but plenty are still behind you, so the opening range widens a little from early position.",
  CO: "CO = cutoff, one seat right of the button. Late position: only a couple of players are left to act behind you, so you can profitably open far more hands than up front.",
  BTN: "BTN = button, the dealer position and the best seat at the table. You act last on every street after the flop, so you can open the widest range of any position.",
  SB: "SB = small blind. You've already posted a forced bet and, after the flop, you'll be first to act every street (the worst position) — so this drill treats the small blind as 3-bet-or-fold.",
  BB: "BB = big blind. You've already put money in and get the best price to defend, so you can continue with a wider range than anyone opening fresh."
};

function describePosition(pos, drillId){
  var base = POSITION_TEXT[pos] || "";
  if(drillId==="facing" && pos!=="SB" && pos!=="BB"){
    return base + " Here you're not opening — you're deciding whether to 3-bet, call, or fold against someone else's raise.";
  }
  return base;
}

var DRAW_MEANING = {
  flush: "a flush draw: four cards of one suit already, one more of that suit makes a flush.",
  oesd: "an open-ended straight draw: four consecutive ranks, either end (one rank up or one rank down) completes a straight.",
  gutshot: "a gutshot straight draw: four ranks with a single missing rank in the middle — only that one rank completes a straight.",
  overcards: "two overcards: your two hole cards both outrank everything on the board, so pairing either one likely makes the best hand.",
  combo: "a combo draw: a flush draw and an open-ended straight draw at the same time, so a lot of different cards can make you a big hand."
};

function buildThisSpot(drillId, q){
  if(drillId==="openfold"){
    return describeHand(q.cards).text + " " + describePosition(q.pos, drillId) + " Folded to you in " + q.pos + " — raise or fold?";
  }
  if(drillId==="pushfold"){
    var rounds = Math.max(1, Math.round(q.stack/2));
    var stackLine = "Your whole stack is " + q.stack + " big blinds — about " + rounds + " rounds of blinds before the blinds alone bust you. Raising a normal amount and folding to a re-raise isn't realistic with this little behind, so the only two options worth considering are shove (all-in) or fold.";
    return describeHand(q.cards).text + " " + describePosition(q.pos, drillId) + " " + stackLine;
  }
  if(drillId==="facing"){
    return describeHand(q.cards).text + " " + describePosition(q.heroPos, drillId) + " " + q.raiserPos + " opens to 2.5 big blinds and the action is on you in the " + q.heroPos + ".";
  }
  if(drillId==="potodds"){
    var drawLine = DRAW_MEANING[q.draw.id] || "";
    return "Pot is " + q.pot + ", villain bets " + q.bet + ". You hold " + drawLine + " (" + (q.street==="flop" ? "two cards still to come" : "one card still to come") + ").";
  }
  if(drillId==="equity"){
    return describeHand(q.hand1).text + " vs " + describeHand(q.hand2).text + " Both hands go to showdown; " + q.sim.iters + " random boards decide who wins how often.";
  }
  return "";
}

function decoderHTML(){
  return '<details class="decoder" open><summary>Decoder — notation &amp; terms</summary>' +
    '<dl>' +
    '<dt>s / o</dt><dd>Suited / offsuit. "AKs" = ace-king suited (same suit). "AKo" = ace-king offsuit (different suits).</dd>' +
    '<dt>+</dt><dd>"And everything better of the same shape." Example: A9o+ = ace-nine offsuit and every better offsuit ace: A9o, ATo, AJo, AQo, AKo.</dd>' +
    '<dt>Dash ranges (e.g. 88-TT)</dt><dd>A contiguous run. 88-TT = 88, 99, TT — every pocket pair from eights up to tens.</dd>' +
    '<dt>Position abbreviations</dt><dd>EP = early position. MP = middle position. CO = cutoff (one seat right of the button). BTN = button (the dealer seat, acts last). SB = small blind. BB = big blind.</dd>' +
    '<dt>bb</dt><dd>"Big blinds" — stack size measured in units of the big blind, not chips or dollars. "8bb" means your whole stack is 8 times the big blind.</dd>' +
    '<dt>Pot odds</dt><dd>The price you’re getting on a call: the equity (win rate) you need to break even, computed as bet ÷ (pot + 2×bet).</dd>' +
    '<dt>Outs</dt><dd>Cards left in the deck that improve your hand to (probably) the best hand.</dd>' +
    '<dt>Equity</dt><dd>Your chance of winning the hand if it were dealt out to the river right now, expressed as a percentage.</dd>' +
    '<dt>3-bet</dt><dd>A re-raise before the flop — if someone’s open raise was the first raise, your re-raise is the "third bet" (counting the big blind as the first).</dd>' +
    '<dt>Dominated</dt><dd>Your hand shares a card with a better hand of the same type (e.g. AJ vs AK) — you can only win by pairing your worse card.</dd>' +
    '<dt>OESD</dt><dd>Open-ended straight draw — four consecutive ranks where either end completes a straight (8 outs).</dd>' +

var STORAGE_KEY = "felt-sharpener-v1";
var state = {v:1, records:[]};
var saveTimer = null;
var debounceMs = 2000;
var lastPublish = 0;
var stopRemoteSync = false;
var pendingPublish = false;

function loadLocal(){
  try{
    var raw = (typeof localStorage !== "undefined") ? localStorage.getItem(STORAGE_KEY) : null;
    if(raw){
      var parsed = JSON.parse(raw);
      if(parsed && Array.isArray(parsed.records)) return parsed;
    }
  }catch(e){ /* ignore malformed/absent */ }
  return null;
}

function saveLocal(){
  try{
    if(typeof localStorage !== "undefined") localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){ /* ignore quota/denied */ }
}

async function getArtifactHandle(){
  try{
    if(typeof window !== "undefined" && window && "claude" in window && window.claude && window.claude.use){
      return await window.claude.use("artifact");
    }
  }catch(e){ /* ignore */ }
  return null;
}

function scheduleSave(){
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, debounceMs);
}

function doSave(){
  saveLocal();
  tryPublish();
}

async function tryPublish(){
  if(stopRemoteSync) return;
  var art = await getArtifactHandle();
  if(!art) return;
  var now = Date.now();
  if(now - lastPublish < 10000){
    if(!pendingPublish){
      pendingPublish = true;
      setTimeout(function(){ pendingPublish = false; tryPublish(); }, 10000 - (now - lastPublish));
    }
    return;
  }
  lastPublish = now;
  try{
    await art.publish({"data/progress.json": JSON.stringify(state)});
  }catch(err){
    handlePublishError(err);
  }
}

function handlePublishError(err){
  var code = (err && (err.code || err.message)) ? String(err.code || err.message) : "";
  if(/conflict/i.test(code)){
    // the winner is automatic — do nothing
    return;
  }
  if(/capability_disabled|not_granted|not_writer|not_declared/i.test(code)){
    stopRemoteSync = true;
    App.localOnlyNotice = true;
    if(App.tab==="progress") render();
    return;
  }
  if(/rate_limited/i.test(code)){
    debounceMs = 30000;
    return;
  }
  if(/upstream_error/i.test(code)){
    setTimeout(tryPublish, 2000 + Math.random()*2000);
    return;
  }
}

}

/* ============================================================
   13. PROGRESS AGGREGATION
   ============================================================ */
function isoDate(d){
  return d.toISOString().slice(0,10);
}
function dateKeyOf(t){
  return isoDate(new Date(t));
}

function computeStreak(){
  var dateSet = {};
  state.records.forEach(function(r){ dateSet[dateKeyOf(r.t)] = true; });
  var cursor = new Date();
  cursor.setUTCHours(0,0,0,0);
  if(!dateSet[isoDate(cursor)]) cursor.setUTCDate(cursor.getUTCDate()-1);
  var streak = 0;
  while(dateSet[isoDate(cursor)]){
    streak++;
    cursor.setUTCDate(cursor.getUTCDate()-1);
  }
  return streak;
}

function computeStats(){
  var total = state.records.length;
  var totalOk = 0;
  var weekOk = 0, weekN = 0;
  var weekAgo = Date.now() - 7*24*60*60*1000;
  state.records.forEach(function(r){
    totalOk += r.ok;
    if(r.t >= weekAgo){ weekN++; weekOk += r.ok; }
  });
  return {
    total: total,
    accuracy: total ? Math.round(totalOk/total*100) : 0,
    weekAccuracy: weekN ? Math.round(weekOk/weekN*100) : 0,
    streak: computeStreak()
  };
}

function byDayAndDrill(){
  // {drill: {date: {n, ok}}}
  var out = {};
  DRILL_IDS.forEach(function(id){ out[id] = {}; });
  state.records.forEach(function(r){
    if(!out[r.drill]) out[r.drill] = {};
    var d = dateKeyOf(r.t);
    if(!out[r.drill][d]) out[r.drill][d] = {n:0, ok:0};
    out[r.drill][d].n++;
    out[r.drill][d].ok += r.ok;
  });
  return out;
}

function svgChart(dates, series, drillId){
  var w = 180, h = 80, padL = 4, padR = 4, padT = 8, padB = 4;
  var innerW = w - padL - padR;
  var n = dates.length;
  function x(i){ return n<=1 ? padL + innerW/2 : padL + (innerW * i/(n-1)); }
  function y(pct){ return padT + (100-pct)/100 * (h-padT-padB); }
  var pts = dates.map(function(d,i){
    var rec = series[d];
    var pct = rec.n ? Math.round(rec.ok/rec.n*100) : 0;
    return {x:x(i), y:y(pct), pct:pct, n:rec.n, date:d};
  });
  var gridlines = [50,80].map(function(g){
    return '<line x1="' + padL + '" y1="' + y(g) + '" x2="' + (w-padR) + '" y2="' + y(g) + '" stroke="var(--line)" stroke-width="1" stroke-dasharray="2,2" />';
  }).join("");
  var pathD = pts.map(function(p,i){ return (i===0?"M":"L") + p.x.toFixed(1) + "," + p.y.toFixed(1); }).join(" ");
  var dots = pts.map(function(p,i){
    var isLast = i===pts.length-1;
    var r = isLast ? 4 : 2.5;
    var title = esc(p.date + ": " + p.pct + "% (n=" + p.n + ")");
    return '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="' + r + '" fill="' + (isLast?"var(--gold)":"var(--ink)") + '" fill-opacity="' + (isLast?1:0.55) + '"><title>' + title + '</title></circle>';
  }).join("");
  var lastLabel = pts.length ? '<text x="' + Math.min(w-2, pts[pts.length-1].x+6) + '" y="' + (pts[pts.length-1].y - 6) + '" font-size="10" fill="var(--ink)" text-anchor="' + (pts[pts.length-1].x > w-30 ? "end":"start") + '">' + pts[pts.length-1].pct + '%</text>' : "";
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '" role="img" aria-label="' + esc(DRILL_TITLES[drillId] + " accuracy over time") + '">' +
    gridlines + '<path d="' + pathD + '" fill="none" stroke="var(--gold)" stroke-width="2" />' + dots + lastLabel + '</svg>';
}

var FOCUS_LINES = {
  openfold: "Most misses are calling a hand \"close enough\" when it's actually one rank below the range boundary — check the Coach's boundary-hand callout before answering.",
  facing: "Slow down on who's in the SB or BB — the same hand plays completely differently depending on whether you're opening, calling in position, or stuck 3-bet-or-fold.",
  potodds: "Re-read the pot odds walk-through in the coach — the arithmetic is always price vs. outs×2 or ×4.",
  pushfold: "Push or Fold is a memorized chart, not a feel decision — lean on the Coach's range boundary until the shove line is automatic.",
  equity: "Name the matchup archetype before guessing a number — \"coin flip\" vs \"dominated\" vs \"race\" gets you within one band almost every time.",
  quiz: "Revisit the Mechanics tab glossary for the terms you keep missing — most quiz misses are vocabulary, not math."
};

function computeDrillStats(records){
  var stats = {};
  DRILL_IDS.forEach(function(id){ stats[id] = {n:0, ok:0, list:[]}; });
  records.forEach(function(r){
    if(!stats[r.drill]) stats[r.drill] = {n:0, ok:0, list:[]};
    stats[r.drill].n++;
    stats[r.drill].ok += r.ok;
    stats[r.drill].list.push(r);
  });
  DRILL_IDS.forEach(function(id){
    var st = stats[id];
    st.accuracy = st.n ? (st.ok/st.n*100) : null;
    var sorted = st.list.slice().sort(function(a,b){ return a.t-b.t; });
    var last30 = sorted.slice(-30);
    var last30ok = 0;
    last30.forEach(function(r){ last30ok += r.ok; });
    st.recentAccuracy = last30.length ? (last30ok/last30.length*100) : null;
  });
  return stats;
}

/* Rule-based suggestion engine. Order: focus/slipping, then tighten, then
   under-practiced, then solid. Caller renders at most the top 3. Returns []
   when no drill has n>=15 yet — caller shows a Week-1-pointing empty state. */
function suggest(records){
  var stats = computeDrillStats(records);
  var qualifying = DRILL_IDS.filter(function(id){ return stats[id].n >= 15; });
  if(qualifying.length === 0) return [];

  var focusList = [], tightenList = [];
  var allSolid = true;
  qualifying.forEach(function(id){
    var st = stats[id];
    var slipping = (st.recentAccuracy !== null) && ((st.accuracy - st.recentAccuracy) >= 10);
    if(slipping || st.accuracy < 70){
      allSolid = false;
      var headline = slipping
        ? (DRILL_TITLES[id] + " is slipping — recent accuracy is down from its lifetime average. " + (FOCUS_LINES[id]||""))
        : (DRILL_TITLES[id] + " is under 70% lifetime — this needs deliberate review, not just more volume. " + (FOCUS_LINES[id]||""));
      focusList.push({
        severity:"focus",
        drill:id,
        headline: headline,
        action: "Run 20 questions of " + DRILL_TITLES[id] + " today."
      });
    } else if(st.accuracy < 85){
      allSolid = false;
      tightenList.push({
        severity:"tighten",
        drill:id,
        headline: DRILL_TITLES[id] + " is in the 70-85% range — solid, but a bit more reps will lock it in. " + (FOCUS_LINES[id]||""),
        action: "Run 15 more questions of " + DRILL_TITLES[id] + " this week."
      });
    }
  });

  var suggestions = focusList.concat(tightenList);

  var underPracticed = DRILL_IDS.filter(function(id){ return stats[id].n < 15; });
  if(underPracticed.length){
    underPracticed.sort(function(a,b){ return stats[a].n - stats[b].n; });
    var pick = underPracticed[0];
    suggestions.push({
      severity:"under-practiced",
      drill: pick,
      headline: DRILL_TITLES[pick] + " only has " + stats[pick].n + " question" + (stats[pick].n===1?"":"s") + " so far — not enough reps yet to know if it needs work.",
      action: "Run 20 questions of " + DRILL_TITLES[pick] + " today."
    });
  }

  if(allSolid){
    suggestions.push({
      severity:"solid",
      drill:null,
      headline: "Everything you've drilled at volume is 85%+ lifetime — nice work.",
      action: "Maintain with a mixed session across drills rather than grinding one."
    });
  }
  return suggestions;
}

var SEVERITY_CHIP_LABEL = {focus:"Focus", tighten:"Tighten", solid:"Solid", "under-practiced":"Under-practiced"};

function suggestionsPanelHTML(records){
  var items = suggest(records).slice(0,3);
  var html = '<div class="panel suggestions-panel"><div class="micro" style="margin-bottom:10px;">Where to tighten up</div>';
  if(items.length === 0){
    html += '<div class="empty-state">Not enough reps yet on any single drill to make a call. Start with <strong>Open or Fold</strong> (the Week 1 drill) and come back after 15+ questions.</div>';
  } else {
    items.forEach(function(item){
      html += '<div class="suggestion-item">' +
        '<span class="chip chip-' + item.severity + '">' + esc(SEVERITY_CHIP_LABEL[item.severity]) + '</span>' +
        '<div class="suggestion-body"><p>' + esc(item.headline) + '</p><p class="suggestion-action">' + esc(item.action) + '</p></div>' +
        '</div>';
    });
  }
  html += '</div>';
  return html;
}

function renderProgress(){
  var html = '';
  if(state.records.length===0){
    html += '<div class="panel"><div class="empty-state">No data yet. Start with <strong>Open or Fold</strong> to build your first streak.</div></div>';
    document.getElementById("fs-content").innerHTML = html;
    return;
  }
  var stats = computeStats();
  html += '<div class="tiles">';
  html += tileHTML(String(stats.total), "Questions answered");
  html += tileHTML(stats.accuracy+"%", "Overall accuracy");
  html += tileHTML(stats.weekAccuracy+"%", "This week");
  html += tileHTML(String(stats.streak), "Day streak");
  html += '</div>';

  html += suggestionsPanelHTML(state.records);

  var grouped = byDayAndDrill();
  var allDates = {};
  DRILL_IDS.forEach(function(id){ Object.keys(grouped[id]).forEach(function(d){ allDates[d]=true; }); });
  var dates = Object.keys(allDates).sort();

  html += '<div class="panel"><div class="micro" style="margin-bottom:10px;">Accuracy by drill, per day</div>';
  html += '<div class="charts-scroll"><div class="chart-row">';
  DRILL_IDS.forEach(function(id){
    var seriesDates = dates.filter(function(d){ return grouped[id][d]; });
    html += '<div class="chart-card"><h4>' + esc(DRILL_TITLES[id]) + '</h4>';
    if(seriesDates.length===0){
      html += '<div class="notice">No attempts yet.</div>';
    } else {
      html += svgChart(seriesDates, grouped[id], id);
    }
    html += '</div>';
  });
  html += '</div></div></div>';

  html += '<div class="panel"><div class="micro" style="margin-bottom:10px;">Data table</div><div class="table-scroll"><table class="progress-table"><thead><tr><th>Date</th>' +
    DRILL_IDS.map(function(id){ return '<th>' + esc(DRILL_TITLES[id]) + '</th>'; }).join("") + '</tr></thead><tbody>';
  dates.forEach(function(d){
    html += '<tr><td class="num">' + d + '</td>';
    DRILL_IDS.forEach(function(id){
      var rec = grouped[id][d];
      if(rec){
        var pct = Math.round(rec.ok/rec.n*100);
        html += '<td class="num">' + pct + '% (' + rec.n + ')</td>';
      } else {
        html += '<td class="num">–</td>';
      }
    });
    html += '</tr>';
  });
  html += '</tbody></table></div></div>';

  if(App.localOnlyNotice){
    html += '<div class="notice">Progress is saved in this browser only.</div>';
  }
  html += '<div class="panel"><button class="btn btn-secondary" id="fs-reset">Reset progress</button></div>';

  document.getElementById("fs-content").innerHTML = html;
  var resetBtn = document.getElementById("fs-reset");
  if(resetBtn) resetBtn.addEventListener("click", function(){
    if(confirm("Reset all progress? This cannot be undone.")){
      state = {v:1, records:[]};
      scheduleSave();
      render();
    }
  });
}

function tileHTML(val, label){
  return '<div class="tile"><span class="val num">' + esc(val) + '</span><span class="micro">' + esc(label) + '</span></div>';
}

function handRankExampleCards(id){
  var C = function(r,s){ return {r:r, s:s}; };
  var A=14,K=13,Q=12,J=11,T=10;
  var EXAMPLES = {
    royal: [C(A,"s"),C(K,"s"),C(Q,"s"),C(J,"s"),C(T,"s")],
    straightflush: [C(9,"h"),C(8,"h"),C(7,"h"),C(6,"h"),C(5,"h")],
    quads: [C(7,"s"),C(7,"h"),C(7,"d"),C(7,"c"),C(2,"s")],
    fullhouse: [C(K,"s"),C(K,"h"),C(K,"d"),C(4,"c"),C(4,"s")],
    flush: [C(A,"c"),C(J,"c"),C(8,"c"),C(6,"c"),C(2,"c")],
    straight: [C(9,"s"),C(8,"h"),C(7,"d"),C(6,"c"),C(5,"s")],
    trips: [C(Q,"s"),C(Q,"h"),C(Q,"d"),C(9,"c"),C(3,"s")],
    twopair: [C(J,"s"),C(J,"h"),C(6,"d"),C(6,"c"),C(2,"s")],
    pair: [C(8,"s"),C(8,"h"),C(K,"d"),C(5,"c"),C(2,"s")],
    highcard: [C(A,"s"),C(J,"h"),C(8,"d"),C(5,"c"),C(2,"s")]
  };
  return EXAMPLES[id];
}

var HAND_RANK_ROWS = [
  {id:"royal", name:"Royal Flush", note:"The best possible hand: an ace-high straight flush. Unbeatable."},
  {id:"straightflush", name:"Straight Flush", note:"Five consecutive ranks, all one suit. Only a higher straight flush (or royal) beats it."},
  {id:"quads", name:"Four of a Kind", note:"Four cards of the same rank, plus any kicker. Ties are broken by the quad rank, then the kicker."},
  {id:"fullhouse", name:"Full House", note:"Three of a kind plus a pair. Ties are broken by the three-of-a-kind's rank first, then the pair's rank."},
  {id:"flush", name:"Flush", note:"Five cards of one suit, not in sequence. Ties are broken by comparing the highest cards in each flush, one by one."},
  {id:"straight", name:"Straight", note:"Five consecutive ranks, mixed suits. The ace can play high (broadway) or low (the wheel, A-2-3-4-5)."},
  {id:"trips", name:"Three of a Kind", note:"Three cards of the same rank plus two unrelated kickers."},
  {id:"twopair", name:"Two Pair", note:"Two different pairs plus a kicker. The HIGHER pair is compared first — Aces-and-Fours beats Kings-and-Queens no matter the second pair."},
  {id:"pair", name:"One Pair", note:"Two cards of the same rank plus three kickers, highest first."},
  {id:"highcard", name:"High Card", note:"No pair, no straight, no flush — just the highest card, then the next, and so on."}
];

var GLOSSARY_TERMS = [
  {id:"ante", term:"Ante", def:"A small forced bet every player posts before the deal, separate from the blinds — common in tournaments to keep pots growing as blinds get high."},
  {id:"bb", term:"bb", def:"\"Big blind(s)\" — either the forced bet itself, or the unit stack sizes are measured in (e.g. a \"20bb stack\")."},
  {id:"blinds", term:"Blinds", def:"Forced bets posted by the two players left of the button (small blind, big blind) before cards are dealt, so there's always something worth playing for."},
  {id:"bluff", term:"Bluff", def:"Betting or raising with a hand that isn't the best, hoping to make a better hand fold."},
  {id:"board", term:"Board", def:"The shared community cards everyone can use — up to 5, revealed across the flop, turn, and river."},
  {id:"broadway", term:"Broadway", def:"Any card ten or higher (T, J, Q, K, A); also used for a broadway straight (T-J-Q-K-A)."},
  {id:"button", term:"Button", def:"The dealer position — acts last on every postflop street, the most powerful seat at the table."},
  {id:"cbet", term:"C-bet (continuation bet)", def:"A bet on the flop by whoever raised preflop, continuing their preflop aggression."},
  {id:"check", term:"Check", def:"Passing the action without betting — only legal when no one has bet yet on that street."},
  {id:"cutoff", term:"Cutoff", def:"The seat directly to the right of the button; the second-best position at the table."},
  {id:"dominated", term:"Dominated", def:"A hand that shares a card with a stronger hand of the same shape (e.g. AJ vs AK) and can only catch up by pairing its weaker card."},
  {id:"draw", term:"Draw", def:"A hand that isn't complete yet but could become strong with one more card (e.g. a flush draw or straight draw)."},
  {id:"equity", term:"Equity", def:"Your percentage chance of winning the pot if the hand were played out to the river right now."},
  {id:"flop", term:"Flop", def:"The first three community cards, dealt face-up together."},
  {id:"fold-equity", term:"Fold equity", def:"The extra value a bet or raise has purely because it might make an opponent fold, on top of your own card equity."},
  {id:"gutshot", term:"Gutshot", def:"An inside straight draw — only one specific rank (four cards) completes the straight."},
  {id:"kicker", term:"Kicker", def:"An unpaired side card that breaks ties between otherwise-equal hands."},
  {id:"limp", term:"Limp", def:"Calling the big blind before the flop instead of raising or folding — usually considered a weak, passive play."},
  {id:"muck", term:"Muck", def:"To fold and discard your hand face-down without showing it."},
  {id:"oesd", term:"OESD", def:"Open-ended straight draw — four consecutive ranks where either end (one card up or down) completes a straight, 8 outs."},
  {id:"offsuit", term:"Offsuit", def:"Two hole cards of different suits, written with an \"o\" (e.g. AKo) — can't make a flush from the two hole cards alone as easily as a suited hand."},
  {id:"open", term:"Open / open-raise", def:"The first raise of a hand preflop, when no one else has entered the pot yet."},
  {id:"outs", term:"Outs", def:"The cards remaining in the deck that would improve your hand to (probably) the best hand."},
  {id:"pot-odds", term:"Pot odds", def:"The price you're being offered on a call, expressed as the equity you need to break even: bet ÷ (pot + 2×bet)."},
  {id:"position", term:"Position", def:"Your seat relative to the button, and therefore how much information you have before acting — later position means more information."},
  {id:"rainbow", term:"Rainbow", def:"A flop (or board) where all cards are different suits, so no flush draw is live yet."},
  {id:"shove", term:"Shove", def:"Betting all of your remaining chips at once (going all-in)."},
  {id:"showdown", term:"Showdown", def:"Revealing hands after the final betting round to determine the winner, when at least two players remain."},
  {id:"side-pot", term:"Side pot", def:"A separate pot created when a player goes all-in for less than the full bet — only players who covered the bet can win it."},
  {id:"suited", term:"Suited", def:"Two hole cards of the same suit, written with an \"s\" (e.g. AKs) — can make a flush using just the two hole cards plus three more of that suit."},
  {id:"nuts", term:"The nuts", def:"The best possible hand given the current board — nothing can beat it."},
  {id:"3bet", term:"3-bet", def:"A re-raise before the flop — if an open raise is the second bet (after the big blind posts the first), a 3-bet is the third."},
  {id:"utg", term:"Under the gun (UTG)", def:"The first player to act preflop, immediately left of the big blind — needs the tightest range since the most players are still behind."},
  {id:"value-bet", term:"Value bet", def:"A bet made because you expect to be called by a worse hand, not as a bluff."}
];

function renderMechanics(){
  var html = '<div class="panel plan-content">';

  html += '<h2>How a Hand Plays Out</h2>';
  html += '<p><strong>Blinds and antes.</strong> Before any cards are dealt, one or two players post forced bets (the small blind and big blind, sometimes plus an ante from everyone). Forced bets exist so there\'s always something worth playing for — without them, every hand would be free to fold and nothing would ever get contested.</p>';
  html += '<p><strong>The deal.</strong> Each player gets two private hole cards, face-down, seen only by them.</p>';
  html += '<p><strong>The four streets.</strong> Betting happens in rounds called streets: <strong>preflop</strong> (after the deal, before any community cards), <strong>flop</strong> (the first 3 community cards appear together), <strong>turn</strong> (a 4th community card), and <strong>river</strong> (the 5th and final community card). A betting round follows each one.</p>';
  html += '<p><strong>Betting actions.</strong> <strong>Check</strong> (pass, no chips — only legal if no one has bet yet this street), <strong>bet</strong> (put chips in when no one else has bet yet), <strong>call</strong> (match the current bet), <strong>raise</strong> (increase the bet, only legal if someone already bet), or <strong>fold</strong> (give up the hand). Once a bet is out, checking is no longer legal — you must call, raise, or fold.</p>';
  html += '<p><strong>Minimum raise.</strong> A raise must increase the bet by at least as much as the previous bet or raise did.</p>';
  html += '<p><strong>All-in and side pots.</strong> A player can bet all remaining chips at once; if that\'s less than the current bet, other players\' extra chips beyond that amount form a separate side pot the short player can\'t win.</p>';
  html += '<p><strong>Showdown.</strong> If two or more players see the river without folding, remaining hands are revealed. Each player makes their best 5-card hand from their 2 hole cards plus the 5 community cards (best 5 of 7); if the hand types tie, the kicker(s) — the highest unused cards — break the tie.</p>';

  html += '<h2>Hand Rankings</h2>';
  html += '<p>From strongest to weakest:</p>';
  html += '<div class="table-scroll"><table class="mech-rank-table">';
  HAND_RANK_ROWS.forEach(function(row){
    html += '<tr><td class="mech-rank-name">' + esc(row.name) + '</td><td>' + cardRowHTML(handRankExampleCards(row.id)) + '</td><td class="mech-rank-note">' + esc(row.note) + '</td></tr>';
  });
  html += '</table></div>';

  html += '<h2>Tournament Basics</h2>';
  html += '<p><strong>Rising blind levels.</strong> Tournament blinds and antes increase on a clock. Your chip stack doesn\'t shrink, but measured in big blinds it does — the same stack supports fewer and fewer bets as levels climb, which is why strategy has to adapt as the tournament goes on.</p>';
  html += '<p><strong>Elimination and payouts.</strong> Players bust when they lose all their chips; the tournament pays a fixed number of finishing positions, usually a shrinking share of the prize pool as you go up the payout ladder.</p>';
  html += '<p><strong>Why stack depth (bb count) dictates strategy.</strong> A deep stack (60bb+) can play a full postflop game with draws and bluffs. A short stack (under ~15bb) doesn\'t have room for that — shoving or folding preflop becomes the highest-EV approach, which is exactly what the Push or Fold drill trains.</p>';
  html += '<p><strong>The bubble.</strong> The bubble is the stretch of the tournament right before the money — one more elimination and everyone left cashes. Players with medium stacks tend to tighten up sharply here to avoid busting one spot short of the money, which opens the door for bigger stacks to apply pressure and steal pots from that same tightening.</p>';

  html += '<h2 id="glossary">Glossary</h2>';
  html += '<dl class="mech-glossary">';
  GLOSSARY_TERMS.forEach(function(g){
    html += '<dt id="gloss-' + g.id + '">' + esc(g.term) + '</dt><dd>' + esc(g.def) + '</dd>';
  });
  html += '</dl>';

  html += '<h2>Further Study</h2>';
  html += '<ul class="mech-links">';
  html += '<li><a class="mech-link" href="https://upswingpoker.com/blog/" target="_blank" rel="noopener noreferrer">Upswing Poker — free strategy articles</a>: solid on the fundamentals in weeks 1-3 (position, preflop ranges, pot odds).</li>';
  html += '<li><a class="mech-link" href="https://www.youtube.com/@JonathanLittlePoker" target="_blank" rel="noopener noreferrer">Jonathan Little — YouTube hand breakdowns</a>: good for weeks 3-5, once you\'re thinking about postflop decisions and tournament play.</li>';
  html += '<li><a class="mech-link" href="https://gtowizard.com" target="_blank" rel="noopener noreferrer">GTO Wizard — free preflop range viewer</a>: from week 2 on, check this trainer\'s drill ranges against real solver output.</li>';
  html += '<li><a class="mech-link" href="https://en.wikipedia.org/wiki/Poker_probability" target="_blank" rel="noopener noreferrer">Wikipedia — Poker probability</a>: the math behind the rule of 2 and 4 used in the Pot Odds & Outs drill.</li>';
  html += '</ul>';
  html += '<p class="mech-books"><strong>Books (no links, library/store):</strong> <em>Essential Poker Math</em> (Alton Hardin) for weeks 1-2 — the arithmetic behind every drill in this app. <em>Harrington on Hold\'em</em>, Vol. 1 (Dan Harrington) for tournament play in weeks 3-5 — the classic text on stack sizes and shove/fold thinking.</p>';

  html += '</div>';
  document.getElementById("fs-content").innerHTML = html;
}

function renderPlan(){
  var html = '<div class="panel plan-content">';
  html += '<h2>The 5-Week Plan</h2>';
  html += '<p><strong>The goal.</strong> You are not becoming a pro in five weeks. You are becoming hard to exploit: tight-aggressive preflop, solvent on pot odds, and dangerous when short-stacked. That beats most home-game and small-tournament fields.</p>';
  html += '<p><strong>Cadence: 30-45 min/day, 6 days/week.</strong> Every day: 15-20 min of drills in this trainer (target the current week\'s focus drills until each shows 80%+ accuracy on the Progress tab, then keep a maintenance mix). Plus the week\'s study/play work below.</p>';

  html += '<div class="week-card"><h3>Week 1 — Foundations & preflop discipline.</h3><p>Learn hand rankings cold, positions and why they matter, and the open-raise ranges. Drills: Open or Fold daily. Study: one article/video on position and one on why limping is bad. Play: none needed yet.</p></div>';

  html += '<div class="week-card"><h3>Week 2 — Defense and the price of a call.</h3><p>Drills: Facing a Raise + Pot Odds & Outs daily, Open or Fold maintenance. Learn outs counting for the standard draws (flush 9, OESD 8, gutshot 4, overcards 6) and the rule of 2 and 4. Play: two 30-60 min play-money or micro-stakes online sessions applying ONLY the preflop discipline.</p></div>';

  html += '<div class="week-card"><h3>Week 3 — Postflop basics.</h3><p>Concepts to study: continuation betting (bet ~1/3-1/2 pot on boards that favor the raiser), value bet vs bluff (know which one your bet is before you make it), don\'t pay off big turn/river raises with one pair. Drills: Pot Odds & Outs + Equity Estimator daily. Play: two sessions; after each, write down the 2 hands you were least sure about.</p></div>';

  html += '<div class="week-card"><h3>Week 4 — Tournament skills.</h3><p>Stack sizes in big blinds, not chips. Under ~15bb your only real moves are shove or fold — learn it as a system. Bubble/ladder awareness: tighten when pay jumps loom, attack medium stacks who are tightening. Drills: Push or Fold daily until 85%+, everything else maintenance. Play: one full online tournament (any tiny buy-in) start to finish.</p></div>';

  html += '<div class="week-card"><h3>Week 5 — Consolidation & the event.</h3><p>First half: mixed drills, keep everything above 80%, one last practice tournament. Last 2-3 days: taper — light maintenance drills only. Event day: eat, no alcohol during play, take every break, and default to the disciplines: fold junk, raise when you enter, count the price on every call, shove-fold under 15bb. Variance is real — a good result is playing well, not cashing.</p></div>';

  html += '<p><strong>Table etiquette & logistics (live-specific).</strong> Act in turn. One motion for a raise or say "raise" first. Protect your cards. Don\'t discuss a live hand. Ask the dealer anything — that\'s their job.</p>';
  html += '</div>';
  document.getElementById("fs-content").innerHTML = html;
}

function onKeydown(ev){
  var content = document.getElementById("fs-content");
  if(!content) return;
  if(ev.key==="Enter"){
    var nextBtn = document.getElementById("fs-next");
    if(nextBtn){ nextBtn.click(); ev.preventDefault(); }
    return;
  }
  if(["1","2","3"].indexOf(ev.key) !== -1){
    var buttons = content.querySelectorAll("[data-choice]:not(:disabled)");
    var idx = Number(ev.key) - 1;
    if(buttons.length <= 3 && buttons[idx]){
      buttons[idx].click();
      ev.preventDefault();
    }
  }
}
